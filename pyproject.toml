[project]
name = "line"
version = "0.1.0"
description = "LINE: LLM-based Iterative Neuron Explanations for Vision Models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=0.17.0",
    "datasets>=3.0.0,<5",
    "diffusers>=0.35.2",
    "numpy>=2.0.0",
    "pillow>=12.0.0",
    "protobuf>=6.33.1",
    "sentencepiece>=0.2.1",
    "torch>=2.9.0",
    "torchvision>=0.24.0",
    "tqdm>=4.0.0",
    "transformers>=4.57.1",
]

[project.optional-dependencies]
notebooks = [
    "matplotlib>=3.10.7",
    "pandas>=2.3.3",
    "scipy>=1.16.2",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=8.0.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.9",
    "ty>=0.0.28",
]

[tool.ruff]
line-length = 100
exclude = ['src/line/data', 'notebooks']

[tool.ruff.lint]
extend-select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "N",    # pep8-naming
    "I",    # isort (import sorting)
    "UP",   # pyupgrade (modernize code)
    "B",    # bugbear (catch bugs)
    "SIM",  # flake8-simplify (simplify code)
    "NPY",  # NumPy-specific rules
    "RUF",  # Ruff-specific rules
]
ignore = [
    "N803", # Argument name should be lowercase
    "N806", # Variable should be lowercase
    "N812", # Lowercase imported as non-lowercase
    "NPY002", # Allow legacy numpy random generation
]

[tool.ty.src]
exclude = ["src/line/data", "download_imagenet.py", "notebooks"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
line = ["prompts/*.txt"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
